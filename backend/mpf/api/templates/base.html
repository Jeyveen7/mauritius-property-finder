<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} · Property finder</title>
<style>
  :root { --teal: #0E6B66; --ink: #12201F; --muted: #4F5B58; --line: #DDE3E1; --bg: #F6F7F5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: var(--ink); text-decoration: none; font-weight: 600; }
  header strong { margin-right: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .muted { color: var(--muted); font-size: 13px; }
  button, .btn { background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #ECEFEE; }
  .ok { background: #DDF0EC; color: #0B5E58; } .warn { background: #FFF1CC; color: #6E4B00; }
  .key { font-family: ui-monospace, monospace; background: #FFF1CC; padding: 10px; border-radius: 8px; word-break: break-all; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <strong>Property finder admin</strong>
  <a href="/admin">Overview</a>
  <a href="/admin/reviews">Duplicates</a>
  <a href="/admin/reports">Reports</a>
  <a href="/admin/sources">Sources &amp; partners</a>
  <form method="post" action="/admin/logout"><button class="secondary">Sign out</button></form>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
