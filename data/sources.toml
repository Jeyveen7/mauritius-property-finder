# Where the listings come from. The scheduled build (.github/workflows/data.yml) reads
# this file every day; nothing else needs to run. Edit it on GitHub to add a source.
#
# [[partner]]  An agency, developer or seller that agreed to docs/legal/partner-terms.md.
#              Either `feed_url` (their own JSON feed, docs/partner-feed.md) or `file`
#              (a CSV or JSON they sent you, committed under data/partners/).
#
# [[crawl]]    A website whose terms you have read and that allow indexing. The build
#              refuses to crawl unless `terms_reviewed_by` and `terms_note` are filled in.

# No listing source has agreed to share yet. The map shows the official EDB lists of
# approved projects (backend/seed/edb_projects.csv, built into every snapshot).
# To try the app with fictional listings locally, point a partner at
# ../backend/seed/sample_feeds/portal_a.json; never publish them.

# [[partner]]
# id = "agency-x"
# name = "Agency X"
# feed_url = "https://agency-x.mu/feed.json"
# images_licensed = true
# terms_accepted = "2026-11-02 by email from jane@agency-x.mu"

# [[crawl]]
# id = "example-portal"
# name = "Example portal"
# start_urls = ["https://example.mu/sitemap-listings.xml"]
# terms_reviewed_by = "Your name"
# terms_note = "Written permission from contact@example.mu on 2026-11-02 to index facts with links back."
